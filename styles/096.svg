  <text x="40" y="174" font-size="14" fill="#12332A" font-family="Georgia, Songti SC, SimSun, serif">我想做一个公众号是 svg skills<animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="0.55s" begin="0.26s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 1 0.5 1"/></text>
